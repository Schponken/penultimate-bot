<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penultimate</title>
<style>
:root{--bg:#04060a;--panel:#090d13;--panel2:#0d131b;--line:#17212d;--ink:#e9eff6;--dim:#6f7f93;--up:#00e676;--down:#ff2e4c;
--warn:#ffb020;--cy:#35c8ff;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body.dragging{user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(4,6,10,.92);backdrop-filter:blur(8px);z-index:20}
h1{font:600 15px var(--mono);margin:0;letter-spacing:.04em}
.pill{font:600 10.5px var(--mono);padding:3px 8px;border-radius:3px;border:1px solid var(--line);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pill.practice{color:var(--warn);border-color:var(--warn)}.pill.live{color:#fff;background:var(--down);border-color:var(--down)}
.pill.ok{color:var(--up);border-color:var(--up)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--down);border-color:var(--down)}
.pill.ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:6px;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
#tele{font:11px var(--mono);color:var(--dim)}
.spacer{flex:1}
button{font-size:12.5px;font-weight:600;font-family:var(--sans);border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 11px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s}
button:hover{border-color:var(--dim)}button:active{transform:scale(.97)}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button.stop{background:var(--down);border-color:var(--down);color:#fff;padding:8px 14px}
button.go{background:var(--up);border-color:var(--up);color:#02170b}
#menuWrap{position:relative}
#menu{position:absolute;right:0;top:38px;width:270px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;display:none;box-shadow:0 20px 60px #000;z-index:40}
#menu.on{display:block;animation:pop .16s var(--ease)}
#menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;font-weight:500;padding:8px 9px}
#menu button:hover{background:var(--line)}#menu button span{color:var(--dim);font:11px var(--mono)}
#menu p{margin:4px 9px 6px;color:var(--dim);font-size:11.5px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
main{padding:12px 16px 40px;max-width:1500px;margin:0 auto}
.banner{border:1px solid var(--down);background:rgba(255,46,76,.1);border-radius:4px;padding:9px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;animation:pop .25s var(--ease)}
.banner.warn{border-color:var(--warn);background:rgba(255,176,32,.09)}
.banner.hint{border-color:var(--line);background:var(--panel);color:var(--dim);font-size:12px}
.banner b{flex:1;font-weight:600}.banner.hint b{font-weight:400}
/* ---- movable widgets ---- */
#grid{position:relative;transition:height .3s var(--ease)}
.w{position:absolute;left:0;top:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:0;overflow:hidden;
  transition:transform .34s var(--ease),width .34s var(--ease),height .34s var(--ease),border-color .2s,box-shadow .2s,opacity .2s}
.w:hover{border-color:#27364a}
@keyframes enter{from{opacity:0}}.w{animation:enter .6s var(--ease) both}
html{overflow-x:clip}
main{transition:transform .6s cubic-bezier(.16,1,.3,1)}main.push{transform:scale(1.05)}
#zveil{position:fixed;inset:0;z-index:45;background:rgba(2,3,6,.62);opacity:0;pointer-events:none;transition:opacity .4s}#zveil.on{opacity:1;pointer-events:auto}
#zoom{position:fixed;z-index:50;display:none;background:linear-gradient(180deg,#111b28,#0a1018);border:1px solid #2f4259;border-radius:10px;padding:16px 18px 14px;box-shadow:0 34px 100px rgba(0,0,0,.8),0 0 0 1px rgba(53,200,255,.14),0 0 60px rgba(53,200,255,.08);max-height:calc(100vh - 76px);overflow:auto;will-change:transform,opacity}
#zoom.on{display:block}#zT{font:600 15px var(--mono);margin:0 30px 10px 0}
.zx{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--dim);font-size:18px;line-height:1;padding:4px 9px}
#zoom .kv{font-size:13px;animation:none;margin:0}#zoom .kv div{padding:7px 0}#zoom .kv p{font-size:13px;margin-top:12px;line-height:1.5}
.zbig{font:500 15px/1.5 var(--sans);margin:0 0 10px}
.w.drag,.w.rsz,.w.nt{transition:none}
.w.drag{z-index:15;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px var(--cy);opacity:.93}
.w.rsz{z-index:15;box-shadow:0 0 0 1px var(--cy)}
.w.max{position:fixed;left:20px;right:20px;top:60px;bottom:18px;z-index:30;box-shadow:0 30px 90px #000;border-color:#2c3d52}
.w.ping{animation:ping 1.5s}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(53,200,255,.75)}100%{box-shadow:0 0 0 16px rgba(53,200,255,0)}}
.wh{display:flex;align-items:center;gap:8px;height:34px;flex:none;padding:0 6px 0 10px;margin:0;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--dim);cursor:grab;user-select:none;-webkit-user-select:none}
body:not(.narrow):not(.lock) .wh{touch-action:none}
.lock .wh,.narrow .wh,.w.max .wh{cursor:default}
.grip{width:0;overflow:hidden;opacity:0;transition:opacity .15s,width .15s;color:var(--cy);letter-spacing:0}
.w:hover .grip{opacity:.9;width:10px}.lock .grip,.narrow .grip,.w.max .grip,.lock .rs,.narrow .rs,.w.max .rs{display:none}
.wt{white-space:nowrap}
.wn{flex:1;min-width:0;text-align:right;font-weight:400;text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{display:flex;gap:2px;opacity:.25;transition:opacity .15s}.w:hover .wb,.w:focus-within .wb,.w.max .wb{opacity:1}
.wb button{padding:0;width:22px;height:22px;border:0;background:none;color:var(--dim);font:14px/1 var(--mono);border-radius:3px}.wb button:hover{background:var(--line);color:var(--ink)}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px 10px;position:relative}
.w.min:not(.max) .wbody,.w.min:not(.max) .rs{display:none}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;opacity:0;touch-action:none;transition:opacity .15s;
  background:linear-gradient(135deg,transparent 50%,var(--cy) 50%,var(--cy) 60%,transparent 60%,transparent 72%,var(--cy) 72%,var(--cy) 82%,transparent 82%)}
.w:hover .rs{opacity:.85}
#ph{position:absolute;left:0;top:0;border:1px dashed var(--cy);background:rgba(53,200,255,.07);border-radius:5px;display:none;pointer-events:none;transition:transform .14s,width .14s,height .14s}
#veil{position:fixed;inset:0;background:rgba(2,3,6,.82);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
#veil.on{opacity:1;pointer-events:auto}
.cw{position:relative;flex:1;min-height:40px}.cw canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.side{flex:1;min-height:0;display:flex;gap:12px}.side .nums{width:132px;flex:none;font:11.5px var(--mono);overflow:auto}
.fill{flex:1;min-height:0;overflow:auto}
/* ---- content ---- */
.hero{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;cursor:pointer;border-radius:4px;margin:0 -6px;padding:2px 6px;transition:background .15s}
.hero:hover{background:var(--panel2)}
.hero .big{font:600 34px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero small,.stat small{display:block;color:var(--dim);font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat b{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.fu{animation:fu .7s}.fd{animation:fd .7s}
@keyframes fu{0%{text-shadow:0 0 14px var(--up);color:var(--up)}}@keyframes fd{0%{text-shadow:0 0 14px var(--down);color:var(--down)}}
.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.cy{color:var(--cy)}.warnc{color:var(--warn)}
.nums div,.kv div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.nums div span:first-child,.kv div span:first-child{color:var(--dim)}
.kv{font:11.5px var(--mono);margin:4px 0 8px;animation:open .22s var(--ease)}
.kv p{font-family:var(--sans);color:var(--dim);margin:6px 0 2px;white-space:normal}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mix{display:flex;gap:6px;margin-top:8px;flex:none}.mix div{flex:1;border:1px solid var(--line);border-radius:3px;padding:6px 8px;font:10.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.mix b{display:block;font:600 19px var(--mono);margin-top:2px}
#regime{flex:none;margin-top:8px}
table{width:100%;border-collapse:collapse;font:11.5px var(--mono);font-variant-numeric:tabular-nums}
td,th{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{text-align:left}th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel)}
.x{cursor:pointer;transition:background .12s}.x:hover{background:var(--panel2)}.x.on{background:var(--panel2)}
tr.x td:first-child::before{content:"▸";color:var(--dim);margin-right:5px;display:inline-block;transition:transform .15s}tr.x.on td:first-child::before{transform:rotate(90deg);color:var(--cy)}
tr.xd td{white-space:normal;text-align:left;background:var(--panel2);padding:2px 10px 4px 20px}
#matrix td{text-align:center;border:1px solid var(--bg);padding:6px 2px;transition:background .5s,box-shadow .12s;cursor:pointer}
#matrix td:hover{box-shadow:inset 0 0 0 1px var(--ink)}#matrix td.pin{box-shadow:inset 0 0 0 2px var(--cy)}
#matrix th{text-align:center;border:0;position:static}#matrix tr.hr th{color:var(--cy)}#matrix tr.hr td{box-shadow:inset 0 1px 0 var(--cy),inset 0 -1px 0 var(--cy)}
.bar{height:6px;background:var(--line);border-radius:2px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--up);transition:width .5s}.bar i.hot{background:var(--down)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.lim{border-radius:4px;margin:0 -6px;padding:1px 6px}
.ev{font:11.5px var(--mono);padding:3px 4px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.ev.new{animation:evin .7s var(--ease)}@keyframes evin{from{opacity:0;transform:translateX(-10px);background:rgba(53,200,255,.18)}}
.ev time{color:var(--dim);flex:none}.ev .k{flex:none;width:80px;color:var(--cy)}.ev .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.on .d{white-space:normal}.evx{font-size:12px;color:var(--dim);padding:2px 4px 6px 12px;border-bottom:1px solid var(--line);background:var(--panel2);animation:open .22s var(--ease)}
.ev .k.reaction{color:var(--warn)}.ev .k.blocked,.ev .k.warning{color:var(--down)}.ev .k.funding,.ev .k.scorekeeper,.ev .k.forecast{color:var(--up)}
textarea{resize:vertical;min-height:60px;font:12px var(--mono);width:100%;padding:8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0}
.steps{list-style:none;padding:0;margin:8px 0}.steps li{padding:4px 0;display:flex;gap:8px;align-items:baseline}
.steps .d{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.steps .done .d{background:var(--up);border-color:var(--up);color:#02170b}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.drop{border:1.5px dashed #2c3d52;border-radius:6px;padding:16px;margin:8px 0;display:flex;gap:12px;align-items:center;justify-content:center;color:var(--dim);transition:border-color .15s,background .15s}
#dropAll{position:fixed;inset:0;z-index:80;background:rgba(2,3,6,.86);display:none;align-items:center;justify-content:center;pointer-events:none}
#dropAll.on{display:flex}#dropAll div{border:2px dashed var(--cy);border-radius:10px;padding:44px 60px;font:600 20px var(--sans);text-align:center;background:rgba(53,200,255,.07)}
#dropAll small{display:block;margin-top:8px;font:400 13px var(--sans);color:var(--dim)}
p{margin:6px 0}.note{color:var(--dim);font-size:12px}a{color:var(--cy)}
.chip{display:inline-block;border:1px solid var(--cy);color:var(--cy);border-radius:10px;padding:0 7px;font:10.5px var(--mono);cursor:pointer;margin-left:6px}
#tip{position:fixed;z-index:60;pointer-events:none;background:rgba(13,19,27,.97);border:1px solid #2c3d52;border-radius:5px;padding:7px 9px;font:11.5px var(--mono);max-width:300px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#tip b{display:block;margin-bottom:3px}#tip div{display:flex;justify-content:space-between;gap:14px}#tip div span:first-child{color:var(--dim)}#tip i{display:block;color:var(--dim);font-style:normal;margin-top:4px;font-family:var(--sans);font-size:11px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <h1>PENULTIMATE</h1>
  <span id="mode" class="pill">starting</span>
  <span id="status" class="pill">…</span>
  <span id="tele"></span>
  <span class="spacer"></span>
  <span id="menuWrap"><button id="menuBtn" aria-haspopup="true" aria-expanded="false">Layout ▾</button>
    <div id="menu"></div></span>
  <button class="stop" onclick="stopAll()">Stop everything</button>
</header>
<main>
  <div id="banners"></div><div id="hint"></div>
  <div id="grid"><div id="ph"></div></div>
</main>
<div id="dropAll"><div>Drop your exchange key file anywhere<small>It is saved on this machine only and never shown on screen</small></div></div>
<div id="veil"></div><div id="zveil"></div>
<div id="zoom" role="dialog" aria-modal="true" aria-labelledby="zT"><button class="zx" onclick="closeZoom()" aria-label="Close">×</button><h3 id="zT"></h3><div id="zB"></div></div><div id="tip"></div><div id="toast"></div>
<script>
let TOKEN="__TOKEN__",VER=null;let S={};let setupDrawn="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=(v,d=2)=>v==null?"–":(v<0?"-":"")+"$"+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const usd0=v=>usd(v,0);
const pct=(v,d=1)=>v==null?"–":(v>0?"+":"")+(v*100).toFixed(d)+"%";
const sign=v=>v==null?"dim":v>0?"up":v<0?"down":"dim";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const p2=n=>String(n).padStart(2,"0");const clock=ts=>{const d=new Date(ts*1000);return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())};
function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600)}
async function post(body,again){try{const r=await fetch("/api/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token:TOKEN})});
  if(r.status===403&&!again){const m=(await (await fetch("/",{cache:"no-store"})).text()).match(/TOKEN="([A-Za-z0-9_-]{8,})"/);if(m){TOKEN=m[1];return post(body,true)}}   // the bot restarted since this tab loaded: pick up its new session and retry
  const j=await r.json();toast(j.message||(j.ok?"done":"failed"));return j.ok}catch(e){toast("could not reach the bot");return false}}
function stopAll(){if(confirm("Cancel all orders, close every position and halt?"))post({cmd:"stop_all"})}
function goLive(){const c=prompt("This places real orders with real money, inside the limits in limits.yaml.\nType GO LIVE to confirm.");if(c)post({cmd:"mode",target:"live",confirm:c.trim()})}
/* the key file goes straight from your disk to the bot on this machine; it is never shown on screen */
function keyFile(f){if(!f)return;if(f.size>20000){toast("that does not look like a key file");return}
  f.text().then(t=>{if(!/privateKey|PRIVATE KEY/.test(t)){toast("that does not look like a key file");return false}return post({cmd:"keys",apiKey:t,secret:"",password:""})}).then(ok=>{if(ok){setupDrawn="";ping("setup")}})}
addEventListener("change",e=>{if(e.target.id==="kf")keyFile(e.target.files[0])});
/* drop the key file anywhere on the page */
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
let dropT=0;
addEventListener("dragover",e=>{if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect="copy";$("dropAll").classList.add("on");clearTimeout(dropT);dropT=setTimeout(()=>$("dropAll").classList.remove("on"),220)});
addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();clearTimeout(dropT);$("dropAll").classList.remove("on");keyFile(e.dataTransfer.files[0])});
function saveKeys(){post({cmd:"keys",apiKey:$("k1").value,secret:$("k2").value,password:""}).then(ok=>{if(ok){setupDrawn="";}})}
const LS={get(k,d){try{const v=localStorage.getItem("pen."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("pen."+k,JSON.stringify(v))}catch(e){}}};
function setH(id,html){const el=$(id);if(el&&el._h!==html){el._h=html;el.innerHTML=html}}
function setT(id,t){const el=$(id);if(el&&el._t!==t){el._t=t;el.textContent=t}}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const C={bg:"#04060a",panel:"#090d13",line:"#17212d",ink:"#e9eff6",dim:"#6f7f93",up:"#00e676",down:"#ff2e4c",warn:"#ffb020",cy:"#35c8ff"};

/* ================= widgets: move, resize, fold, full screen ================= */
const R=36,G=8,DEF={},EL={},grid=$("grid"),ph=$("ph"),veil=$("veil");
const cwrap=id=>`<div class="cw"><canvas id="${id}"></canvas></div>`;
[["acct","Account",0,0,5,7,3,4,`<div class="hero" data-x="k:acct" data-tip="Click to zoom into the full breakdown"><div><small>Account value</small><div class="big" id="kEq">–</div></div>
   <div class="stat"><small>Today</small><b id="kDay">–</b></div><div class="stat"><small>Since start</small><b id="kTot">–</b></div><div class="stat"><small>Fees paid</small><b id="kFee">–</b></div><div class="stat"><small>Funding</small><b id="kFun">–</b></div></div><div id="heroX"></div>${cwrap("cCurve")}`],
 ["price","Price",5,0,7,7,4,4,cwrap("cPrice")],
 ["lat","Probability lattice",0,7,4,7,3,5,`<div class="side">${cwrap("cLat")}<div class="nums" id="latStats"></div></div>`],
 ["ridge","Forecast ridge",4,7,5,7,3,5,cwrap("cRidge")],
 ["matrix","Odds matrix",9,7,3,7,3,4,`<div class="fill"><div id="matrix"></div><p class="note" id="modelLine"></p></div>`],
 ["graph","Signal graph",0,14,8,9,4,6,cwrap("cGraph")],
 ["reg","Market state",8,14,4,9,3,5,`${cwrap("cReg")}<div class="mix" id="regMix"></div><div id="regime"></div>`],
 ["limits","Hard limits in use",0,23,4,7,3,4,`<div class="fill"><div id="limits"></div><div id="strats"></div></div>`],
 ["pos","Positions and orders",4,23,4,7,3,3,`<div class="fill" id="pos"></div>`],
 ["fills","Trades",8,23,4,7,3,3,`<div class="fill" id="fills"></div>`],
 ["events","What the bot is doing",0,30,12,6,4,3,`<div class="fill" id="events"></div>`],
 ["score","Forecaster scoreboard",0,36,6,8,3,3,`<div class="fill" id="score"></div>`],
 ["calls","Open calls being tracked",6,36,6,8,3,3,`<div class="fill" id="calls"></div>`],
 ["setup","Setup",0,44,12,11,4,4,`<div class="fill" id="setup"></div>`]
